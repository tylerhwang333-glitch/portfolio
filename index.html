<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tyler Hwang | Software Engineer</title>
    <meta
      name="description"
      content="Tyler Hwang is a software engineering student at San Jose State University building full-stack applications with React, TypeScript, Python, and FastAPI."
    />
    <meta name="author" content="Tyler Hwang" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social previews. Update SITE_URL below after your first Vercel deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tyler Hwang | Software Engineer" />
    <meta property="og:description" content="Software engineering student at SJSU building full-stack applications." />
    <meta property="og:url" content="https://tylerhwang.vercel.app/" />
    <meta property="og:image" content="https://tylerhwang.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tyler Hwang, software engineering student at SJSU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tyler Hwang | Software Engineer" />
    <meta name="twitter:description" content="Software engineering student at SJSU building full-stack applications." />
    <meta name="twitter:image" content="https://tylerhwang.vercel.app/og-image.png" />
    <link rel="canonical" href="https://tylerhwang.vercel.app/" />

    <!-- Set theme before first paint to avoid a flash. Saved choice wins, then system preference, then dark. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
